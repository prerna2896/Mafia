[workspace]
resolver = "2"
members = ["core", "ffi-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mafia"]
license = "MIT"
repository = "https://github.com/prerna2896/mafia-core-rust"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
