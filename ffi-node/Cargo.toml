[package]
name = "mafia-core-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node.js binding for mafia-core via napi-rs"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
mafia-core = { path = "../core" }
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
